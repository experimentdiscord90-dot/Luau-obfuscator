  w(`  return function(...) return ${runf}(${P}, list, ...) end`);
  w(`end`);
  w(`${runf} = function(${P}, ${uvn}, ...)`);
  w(`  local all = { n = ${sel}("#", ...), ... }`);
  w(`  local regs = {}`);
  w(`  for i = 1, ${P}.nparam do regs[i - 1] = all[i] end`);
  w(`  local vargs = { n = 0 }`);
  w(`  if ${P}.vararg then`);
  w(`    vargs.n = all.n - ${P}.nparam`);
  w(`    if vargs.n < 0 then vargs.n = 0 end`);
  w(`    for i = 1, vargs.n do vargs[i] = all[${P}.nparam + i] end`);
  w(`  end`);
  w(`  local code, consts, protos = ${P}.code, ${P}.consts, ${P}.protos`);
  if(flags.controlFlow){
    w(`  local pcxEnc, top = ${bx}(1, ${cfMask}), ${P}.nstack`);
    w(`  while true do`);
    w(`    local pcx = ${bx}(pcxEnc, ${cfMask})`);
  }else{
    w(`  local pcx, top = 1, ${P}.nstack`);
    w(`  while true do`);
  }
  w(`    local ins = code[pcx]`);
  w(`    pcx = pcx + 1`);
  w(`    local op = ins[1]`);

  const branches={
    MOVE:()=>[`regs[ins[2]] = regs[ins[3]]`],
    LOADK:()=>flags.strEnc?[
      `local v = consts[ins[3] + 1]`,
      `if ${ty}(v) == "table" then local enc = ${rg}(v, "${lazyTag}") if enc ~= nil then v = ${G('dstr')}(enc) consts[ins[3] + 1] = v end end`,
      `regs[ins[2]] = v`
    ]:[`regs[ins[2]] = consts[ins[3] + 1]`],
    LOADBOOL:()=>[`regs[ins[2]] = ins[3] == 1`,`if ins[4] == 1 then pcx = pcx + 1 end`],
    LOADNIL:()=>[`regs[ins[2]] = nil`],
    GETGLOBAL:()=>[`regs[ins[2]] = ${envf}[consts[ins[3] + 1]]`],
    SETGLOBAL:()=>[`${envf}[consts[ins[3] + 1]] = regs[ins[2]]`],
    GETUPVAL:()=>[`local uv = ${uvn}[ins[3] + 1]`,`regs[ins[2]] = uv.frame[uv.idx]`],
    SETUPVAL:()=>[`local uv = ${uvn}[ins[3] + 1]`,`uv.frame[uv.idx] = regs[ins[2]]`],
    GETTABLE:()=>[`regs[ins[2]] = ${idxF}(regs[ins[3]], regs[ins[4]])`],
    SETTABLE:()=>[`${setF}(regs[ins[2]], regs[ins[3]], regs[ins[4]])`],
    GETFIELD:()=>[`regs[ins[2]] = ${idxF}(regs[ins[4]], consts[ins[3] + 1])`],
    SETFIELD:()=>[`${setF}(regs[ins[2]], consts[ins[3] + 1], regs[ins[4]])`],
    NEWTABLE:()=>[`regs[ins[2]] = {}`],
    SETI:()=>[`regs[ins[2]][ins[3]] = regs[ins[4]]`],
    CALL:()=>[
      `local ra = ins[2]`,
      `local f = regs[ra]`,
      `local n = ins[3] - 1`,
      `if n < 0 then n = top - ra end`,
      `local args = {}`,
      `for i = 1, n do args[i] = regs[ra + i] end`,
      `local rn, res`,
      `if ${ty}(f) == "function" then`,
      `  rn, res = ${pk}(f(${un}(args, 1, n)))`,
      `else`,
      `  local m = ${getmt}(f)`,
      `  local h = m and ${rg}(m, ${mmcall}) or nil`,
      `  if ${ty}(h) == "function" then`,
      `    rn, res = ${pk}(h(f, ${un}(args, 1, n)))`,
      `  else`,
      `    ${er}("${rerr()}", 0)`,
      `  end`,
      `end`,
      `local want = ins[4] - 1`,
      `if want < 0 then want = rn end`,
      `for i = 1, want do regs[ra + i - 1] = res[i] end`,
      `if ins[4] == 0 then top = ra + want - 1 end`
    ],
    RETURN:()=>[
      `local ra = ins[2]`,
      `local n = ins[3] - 1`,
      `if n < 0 then n = top - ra + 1 end`,
      `local res = {}`,
      `for i = 1, n do res[i] = regs[ra + i - 1] end`,
      `return ${un}(res, 1, n)`
    ],
    JMP:()=>[`pcx = pcx + ins[3]`],
    TEST:()=>[
      `local v = regs[ins[2]]`,
      `if (v ~= nil and v ~= false) == (ins[4] == 1) then pcx = pcx + 1 end`
    ],
    EQ:()=>[`if ${ef}(regs[ins[2]], regs[ins[3]]) ~= (ins[4] == 1) then pcx = pcx + 1 end`],
    LT:()=>[`if ${ltf}(regs[ins[2]], regs[ins[3]]) ~= (ins[4] == 1) then pcx = pcx + 1 end`],
    LE:()=>[`if ${lef}(regs[ins[2]], regs[ins[3]]) ~= (ins[4] == 1) then pcx = pcx + 1 end`],
    ADD:()=>[`regs[ins[2]] = ${arf}(1, regs[ins[3]], regs[ins[4]])`],
    SUB:()=>[`regs[ins[2]] = ${arf}(2, regs[ins[3]], regs[ins[4]])`],
    MUL:()=>[`regs[ins[2]] = ${arf}(3, regs[ins[3]], regs[ins[4]])`],
    DIV:()=>[`regs[ins[2]] = ${arf}(4, regs[ins[3]], regs[ins[4]])`],
    MOD:()=>[`regs[ins[2]] = ${arf}(5, regs[ins[3]], regs[ins[4]])`],
    POW:()=>[`regs[ins[2]] = ${arf}(6, regs[ins[3]], regs[ins[4]])`],
    CONCAT:()=>[
      `local acc = regs[ins[3]]`,
      `for i = ins[3] + 1, ins[4] do acc = ${cf}(acc, regs[i]) end`,
      `regs[ins[2]] = acc`
    ],
    UNM:()=>[
      `local v = regs[ins[3]]`,
      `if ${ty}(v) == "number" then regs[ins[2]] = -v`,
      `else`,
      `  local c = ${tn}(v)`,
      `  if c then regs[ins[2]] = -c`,
      `  else`,
      `    local m = ${getmt}(v)`,
      `    local h = m and ${rg}(m, ${mmunm}) or nil`,
      `    if ${ty}(h) == "function" then regs[ins[2]] = h(v)`,
      `    else ${er}("${rerr()}", 0) end`,
      `  end`,
      `end`
    ],
    NOT:()=>[`regs[ins[2]] = not regs[ins[3]]`],
    LEN:()=>[`regs[ins[2]] = ${lf}(regs[ins[3]])`],
    CLOSURE:()=>[`regs[ins[2]] = ${mkf}(protos[ins[3] + 1], regs, ${uvn})`],
    SELF:()=>[
      `local o = regs[ins[2]]`,
      `regs[ins[2]] = ${idxF}(o, consts[ins[3] + 1])`,
      `regs[ins[2] + 1] = o`
    ],
    VARARG:()=>[
      `local ra = ins[2]`,
      `local n = ins[3] - 1`,
      `if n < 0 then n = vargs.n end`,
      `for i = 1, n do regs[ra + i - 1] = vargs[i] end`,
      `if ins[3] == 0 then top = ra + n - 1 end`
    ],
    FORPREP:()=>[
      `local base = ins[2]`,
      `local init, limit, step = regs[base], regs[base + 1], regs[base + 2]`,
      `if ${ty}(init) ~= "number" then init = ${tn}(init) end`,
      `if ${ty}(limit) ~= "number" then limit = ${tn}(limit) end`,
      `if ${ty}(step) ~= "number" then step = ${tn}(step) end`,
      `if init == nil or limit == nil or step == nil then ${er}("${rerr()}", 0) end`,
      `if step == 0 then ${er}("${rerr()}", 0) end`,
      `regs[base], regs[base + 1], regs[base + 2] = init, limit, step`,
      `if (step > 0 and init > limit) or (step < 0 and init < limit) then`,
      `  pcx = pcx + ins[3]`,
      `else`,
      `  regs[base + 3] = init`,
      `end`
    ],
    FORLOOP:()=>[
      `local base = ins[2]`,
      `local v = regs[base] + regs[base + 2]`,
      `regs[base] = v`,
      `if (regs[base + 2] > 0 and v <= regs[base + 1]) or (regs[base + 2] < 0 and v >= regs[base + 1]) then`,
      `  regs[base + 3] = v`,
      `  pcx = pcx + ins[3]`,
      `end`
    ],
    TFORCALL:()=>[
      `local base = ins[2]`,
      `local f = regs[base]`,
      `local res`,
      `if ${ty}(f) == "function" then`,
      `  res = { f(regs[base + 1], regs[base + 2]) }`,
      `else`,
      `  local m = ${getmt}(f)`,
      `  local h = m and ${rg}(m, ${mmcall}) or nil`,
      `  if ${ty}(h) == "function" then`,
      `    res = { h(f, regs[base + 1], regs[base + 2]) }`,
      `  else`,
      `    ${er}("${rerr()}", 0)`,
      `  end`,
      `end`,
      `if res[1] ~= nil then`,
      `  for i = 1, ins[3] do regs[base + 3 + i] = res[i] end`,
      `  pcx = pcx + 1`,
      `end`
    ]
  };

  const order=OPS.slice();
  if(flags.shuffle)shuffleArr(order);
  order.forEach((name,i)=>{
    const num=o.opmap[OPS.indexOf(name)];
    w(`${i===0?'if':'elseif'} op == ${num} then`);
    for(const ln of branches[name]())w('  '+ln);
  });
  if(flags.opcodeDecoys){
    const used=new Set(o.opmap), count=3+ri(5), fake=[];
    while(fake.length<count){const n=40+ri(88);if(!used.has(n)&&!fake.includes(n)){fake.push(n);used.add(n);}}
    for(const n of fake){
      const a=G('opA'+n),b=G('opB'+n);
      w(`elseif op == ${n} then local ${a}=${ri(65536)} local ${b}=(${a}*${1+ri(31)}+${ri(255)})%65537 local _=${b}`);
    }
  }
  w(`else`);
  w(`  ${er}("${rerr()}", 0)`);
  w(`end`);
  if(flags.controlFlow)w(`    pcxEnc = ${bx}(pcx, ${cfMask})`);
  w(`  end`);
  w(`end`);

  const mp=G('mainp'),mf=G('mainf');
  if(flags.paged && o.pages && o.pages.length){
    const pg=G('pages'),ord=G('order'),ld=G('loadpages'),pc=G('pagecheck'),ps=G('parts'),fk=G('fk'),fl=G('fl'),fc=G('fc'),fd=G('fd');
    const pageRows=o.pages.map(x=>`{["${fk}"]=${x.slot},["${fl}"]=${x.data.length},["${fc}"]=${x.sum},["${fd}"]="${escLuaStr(transport(x.data))}"}`).join(',');
    const orderRows=o.pageOrder.join(',');
    w(`local ${pg} = {${pageRows}}`);
    w(`local ${ord} = {${orderRows}}`);
    w(`local function ${pc}(s) local v=0 for i=1,#s do v=(v+${sA}.byte(s,i))%65521 end return v end`);
    w(`local function ${ld}() local ${ps}={} for i=1,#${ord} do local p=${pg}[${ord}[i]] local raw=p["${fd}"] ${v2?`raw=${p85d}(raw) `:``}if not p or #raw~=p["${fl}"] or ${pc}(raw)~=p["${fc}"] then ${er}("${rerr()}",0) end ${ps}[i]=raw end return ${tA}.concat(${ps}) end`);
    w(`local blob_dec, is_buf_b64 = ${b64d}(${ld}())`);
  }else{
    w(`local blob_dec, is_buf_b64 = ${b64d}(${v2?`${p85d}("${transport(o.blob)}")`:`"${o.blob}"`})`);
  }
  w(`local blob_unx, is_buf = ${ux}(blob_dec, is_buf_b64)`);
  w(`local ${mp} = ${desf}(blob_unx, is_buf)`);
  w(`local ${mf} = ${mkf}(${mp}, nil, nil)`);
  w(`return ${mf}()`);

  if(one) return L.filter(x=>x.trim()!=='').join(' ');
  return L.join('\n');
}

function packReturnTable(code){
  let level=0, eq='';
  while(code.includes(']'+eq+']')){level++;eq='='.repeat(level);}
  const key=(secureU32()>>>0).toString(10);
  return `return({[${key}]=[${eq}[${code}]${eq}]})`;
}

function obfuscate(src,opts){
  opts={...opts};
  if(opts.adaptiveJunk&&opts.junk&&opts.profile!=='release'){
    const srcBytes=toUTF8(src).length;
    opts.junkMaxBytes=Math.min(Number(opts.junkMaxBytes)||0,Math.min(43*1024,Math.max(1024,srcBytes*2)));
  }
  _s=secureU32();
  _used.clear();

  let buildId='HB-';
  for(let _b=0;_b<10;_b++)buildId+='0123456789ABCDEF'[ri(16)];

  const prngSeed=secureU32();
  let prng_state=prngSeed;
  function prng_next(){
    prng_state^=(prng_state<<13)>>>0;
    prng_state^=prng_state>>>17;
    prng_state^=(prng_state<<5)>>>0;
    return prng_state>>>0;
  }

  let ast=new Parser(tokenize(src)).parse();
  if(opts.neutralizeEnv)ast={...ast,body:neutralizeEnvBlock(ast.body)};
  const main=compile(ast,opts);
  if(opts.deadCode){
    const cs='0123456789!@#$%^&*_+;:.XZQ';
    (function walk(p){
      const n=6+ri(15);
      for(let i=0;i<n;i++){
        let s='';
        const L=6+ri(30);
        for(let j=0;j<L;j++)s+=cs[ri(cs.length)];
        p.consts.push(s);
      }
      p.protos.forEach(walk);
    })(main);
  }
  const opmap=OPS.map((_,i)=>i);
  if(opts.shuffle)shuffleArr(opmap);
  const strKey=randomKeyBytes(10+ri(8));
  const blobKey=randomKeyBytes(18+ri(14));
  const stats={instrs:0,consts:0,protos:0};
  const bytes=[72,65,70,49];
  serializeProto(main,bytes,opmap,b=>opts.strEnc?xorBytes(b,strKey):b,stats,prng_next);

  let auth=2166136261;
  for(let i=0;i<bytes.length;i++)auth=((((auth^bytes[i])>>>0)*33)+blobKey[i%blobKey.length])>>>0;
  w32(bytes,auth);
  let s1=0,s2=0;
  for(let i=0;i<bytes.length;i++){
    s1=(s1+bytes[i])%65521;
    s2=(s2+s1)%65521;
  }
  w32(bytes,(s2*65536)+s1);

  const alphabet=shuffledAlphabet();
  const blob=b64encode(xorBytes(bytes,blobKey),alphabet);
  let pages=null,pageOrder=null;
  if(opts.paged){
    const pageSize=192+ri(193);
    const raw=[];
    for(let i=0;i<blob.length;i+=pageSize)raw.push(blob.slice(i,i+pageSize));
    pages=raw.map((data,i)=>({slot:i+1,data,sum:[...data].reduce((a,ch)=>(a+ch.charCodeAt(0))%65521,0)}));
    const originalSlots=pages.map(x=>x.slot);
    pageOrder=pages.map((_,i)=>i+1);
    shuffleArr(pageOrder);
    pages=pageOrder.map(i=>pages[i-1]);
    pageOrder=originalSlots.map(slot=>pages.findIndex(p=>p.slot===slot)+1);
  }
  const vmOptions={blob,blobKey,strKey,alphabet,opmap,prngSeed,buildId,pages,pageOrder,flags:opts};
  const rawCode=genVM(vmOptions);
  const validateGenerated=(text,label)=>{
    const toks=tokenize(text);
    for(const t of toks)if(t.type==='name'&&t.value==='undefined')throw new Error('internal error: unresolved symbol in '+label);
    try{ new Parser(toks).parse(); }
    catch(e){ throw new Error('self-check rejected '+label+': '+e.message); }
  };
  validateGenerated(rawCode,'VM payload');
  const packed=opts.packWrapper?packReturnTable(rawCode):rawCode;
  const code=(opts.banner&&opts.packWrapper?'--[=[  /\\_/\\  LUAU OBFUSCATOR  \\_/\\  ]=] ':'')+packed;
  const outputBytes=toUTF8(code).length;
  if(outputBytes>3*1024*1024)throw new Error('output exceeds the 3 MiB safety limit ('+Math.ceil(outputBytes/1024)+' KiB); reduce source size or junk cap');
  if(opts.packWrapper)validateGenerated(code,'packed wrapper');
  stats.junkBytes=vmOptions.junkBytes||0;
  stats.junkTarget=opts.junkMaxBytes||0;
  stats.outputBytes=toUTF8(code).length;
  stats.packed=!!opts.packWrapper;
  return {code,stats,junkBytes:stats.junkBytes,buildId};
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { obfuscate, tokenize, Parser };
} else if (typeof window !== 'undefined') {
  window.obfuscate = obfuscate;
}

function runObf(){
  var st=document.getElementById("st");
  var src=document.getElementById("si").value;
  if(!src.trim()){st.textContent="Nothing!";st.className="bad";return}
  st.textContent="Obfuscating...";
  st.className="";
  setTimeout(function(){
    try {
      var opts = {
        neutralizeEnv: document.getElementById("anti").checked,
        packWrapper: true,
        junk: true,
        strEnc: true,
        controlFlow: true,
        shuffle: true,
        deadCode: true,
        stealth: true,
        adaptiveJunk: true,
        junkMaxBytes: 1024 * 20
      };
      var result = obfuscate(src, opts);
      document.getElementById("so").value = result.code;
      st.textContent = "Done! (" + result.stats.outputBytes + " bytes, " + result.stats.instrs + " instrs)";
    } catch(e) {
      st.textContent = "Error: " + e.message;
      st.className = "bad";
      console.error(e);
    }
  }, 50);
}
